[book]
title = "How Java Minecraft Works"
description = "System-level documentation of the current Java Minecraft codebase — names, never code."
authors = ["Alexander Fraser"]
language = "en"
src = "src"

[build]
build-dir = "book"

# Diagrams are mermaid blocks in the pages: `cargo install mdbook-mermaid`
# then `mdbook-mermaid install .` once to drop the assets in.
[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/AlexanderjFraser/MinecraftDocs"
# Makes the 404 page's links and assets absolute, so a miss under a nested URL
# (Cloudflare Pages serves 404.html for any missing path) is still styled and
# navigable. Every other page is unaffected.
site-url = "/"
additional-js = ["mermaid.min.js", "mermaid-init.js", "diagram-zoom.js", "site-footer.js"]
# Wider column for tables/diagrams, prose capped at 800px, identifiers wrap
# in table cells (pass 3, planning session).
additional-css = ["custom.css"]

# The sidebar folds to the current part; each part's landing page
# (src/systems/<part>/README.md, pass 3) is what the fold opens on.
[output.html.fold]
enable = true
level = 0

# Pass-2 session H split Part X into "The client" (systems/client) and
# "Rendering" (systems/rendering); these keep the published URLs alive.
[output.html.redirect]
"/systems/client/the-frame.html" = "../rendering/the-frame.html"
"/systems/client/blaze3d.html" = "../rendering/blaze3d.html"
"/systems/client/models-and-atlases.html" = "../rendering/models-and-atlases.html"
"/systems/client/entity-rendering.html" = "../rendering/entity-rendering.html"
"/systems/client/lightmap-fog-and-sky.html" = "../rendering/lightmap-fog-and-sky.html"
"/systems/client/particles.html" = "../rendering/particles.html"
"/systems/client/client-world-and-options.html" = "the-client-level.html"
# Pass-3 session C: the appendix dissolved (R1) and math-and-primitives moved to Reference.
"/systems/appendix/out-of-scope-tour.html" = "../anatomy/what-this-book-skips.html"
"/systems/appendix/naming-drift.html" = "../../reference/naming-drift.html"
"/systems/appendix/glossary.html" = "../../reference/glossary.html"
"/systems/foundations/math-and-primitives.html" = "../../reference/math-and-primitives.html"
# Pass-3 session D: server-lifecycle split into startup and the three endings.
"/systems/server/server-lifecycle.html" = "starting-a-server.html"
# Pass-3 session E: Part IV's two splits, and level-data-and-rules moved to Reference (R5).
"/systems/world/level-data-and-rules.html" = "../../reference/level-data-and-rules.html"
"/systems/world/block-ticks-and-fluids.html" = "scheduled-ticks.html"
"/systems/world/game-events-and-poi.html" = "points-of-interest.html"
# Pass-3 session F: redstone split three ways (signal · pistons · diodes).
"/systems/blocks/redstone.html" = "signal-and-dust.html"
# Pass-3 session I: hunger-xp-and-effects split and renamed.
"/systems/player/hunger-xp-and-effects.html" = "hunger-and-experience.html"
# Pass-3 session K: sound split into the engine and the content model.
"/systems/client/sound.html" = "sound-engine.html"
# Pass-3 session L: level-rendering split into visibility/frame-graph and section meshing.
"/systems/rendering/level-rendering.html" = "visibility-and-the-frame-graph.html"
"/systems/client/level-rendering.html" = "../rendering/visibility-and-the-frame-graph.html"
# Pass-3 session M: worldgen-pipeline renamed terrain (Part IV owns "the pipeline"),
# and structures split into placement and the jigsaw/template assembler.
"/systems/worldgen/worldgen-pipeline.html" = "terrain.html"
"/systems/worldgen/structures.html" = "structure-placement.html"
# Pass-3 session N: Part XIII's two splits — the engine from the function model,
# and dialogs from game tests.
"/systems/commands/execution-and-functions.html" = "the-execution-engine.html"
"/systems/commands/dialogs-and-tests.html" = "dialogs.html"
